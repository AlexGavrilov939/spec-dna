# https://github.com/DavidAnson/markdownlint-cli2#configuration
config:
  default: true
  # The prose has no hard wrap. Editors soft-wrap it.
  MD013: false
  # Different sections can repeat a heading (for example, in changelogs).
  MD024:
    siblings_only: true
  # Templates and CLAUDE.md do not start with an H1.
  MD041: false

gitignore: true

# The agent files of the upgrade fixtures are the bytes that spec-dna 0.5.0
# wrote. A change breaks the hash in their marker, so lint cannot fix them.
ignores:
  - "tests/fixtures/upgrade/**/.claude/**"

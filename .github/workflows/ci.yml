name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure --color=always
        env:
          # The local guard that stops commits to master does not apply to CI.
          SKIP: no-commit-to-branch

  # D20 of docs/design/0.7.0.md and ADR 0013. The binary of this tree checks the
  # documents of this repository. One command serves both events. In a pull
  # request, the merge base of origin/master and HEAD is the base of the change
  # checks. After a push to master, the merge base is HEAD, so the change checks
  # see an empty diff and the other rules still run on the whole tree.
  self-check:
    name: Self-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      # The full history gives the merge base and the approvals in the branch.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust ${{ env.RUSTUP_TOOLCHAIN }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - name: Build the tree binary
        run: cargo build --locked

      - name: Check this repository
        run: target/debug/spec-dna check --base origin/master

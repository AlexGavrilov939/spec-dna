name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this workflow, and publishes the binaries of the
  # run only if every job passes.
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: "1.99.1"
  ZIG_VERSION: "0.17.0"
  CARGO_ZIGBUILD_VERSION: "0.24.0"
  MANIFEST_PATH: Cargo.toml
  BIN: spec-dna

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUSTUP_TOOLCHAIN }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update --component rustfmt,clippy

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  demo:
    name: Demo replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUSTUP_TOOLCHAIN }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      # docs/demo.md describes the replay: setup from the quickstart, upgrade
      # with a rollback, and uninstall, without an agent.
      - name: Replay the demo
        run: scripts/demo-replay.sh "$RUNNER_TEMP/demo"

  targets:
    name: List targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scripts/cross-build.sh contains the list of the 7 targets of ADR 0003.
      - name: List targets
        id: list
        run: echo "targets=$(scripts/cross-build.sh --list --all | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The GitHub runner images include rustup. This step installs it on a bare Linux host.
      - name: Install rustup
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Rust ${{ env.RUSTUP_TOOLCHAIN }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      # Zig asks automation to download from community mirrors, in random
      # order. The SHA-256 pins come from https://ziglang.org/download/index.json.
      # Change them when ZIG_VERSION changes.
      - name: Install zig ${{ env.ZIG_VERSION }}
        run: |
          case "$(uname -m)" in
            x86_64) sum=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026 ;;
            aarch64) sum=9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8 ;;
            *) echo "no pinned zig for $(uname -m)" >&2; exit 1 ;;
          esac
          name=zig-$(uname -m)-linux-$ZIG_VERSION
          mirrors=$(curl -fsS --max-time 30 https://ziglang.org/download/community-mirrors.txt | shuf) || mirrors=
          for base in $mirrors "https://ziglang.org/download/$ZIG_VERSION"; do
            if curl -fsSL --max-time 300 -o "$RUNNER_TEMP/$name.tar.xz" "$base/$name.tar.xz?source=spec-dna-ci" &&
              echo "$sum  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -; then
              echo "zig from $base"
              tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
              echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "no mirror served $name.tar.xz with the pinned SHA-256" >&2
          exit 1

      - name: Install cargo-zigbuild ${{ env.CARGO_ZIGBUILD_VERSION }}
        run: cargo install --locked "cargo-zigbuild@$CARGO_ZIGBUILD_VERSION"

      - name: Build
        run: scripts/cross-build.sh --manifest-path "$MANIFEST_PATH" --bin "$BIN" "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ env.BIN }}
            target/${{ matrix.target }}/release/${{ env.BIN }}.exe
          if-no-files-found: error
          retention-days: 7

  # ADR 0003: each binary runs on a native runner of its target before a
  # release can publish it.
  smoke:
    name: Run ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: x86_64-pc-windows-gnu, runner: windows-2025 }
          - { target: aarch64-pc-windows-gnullvm, runner: windows-11-arm }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: bin

      - name: Run the binary
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$MANIFEST_PATH" | head -n 1)
          exe=bin/$BIN
          [ -f "$exe" ] || exe=$exe.exe
          scripts/smoke.sh "$exe" "$version"

name: Feature request
description: Propose a new capability or a change to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or not possible today, and who has this problem.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change that you propose. Examples of specs, prompts or commands help.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives that you considered

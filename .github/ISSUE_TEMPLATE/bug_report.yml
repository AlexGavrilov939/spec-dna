name: Bug report
description: Something does not work as the documentation says.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, agent and its version (Claude Code, Codex, other), spec-dna commit.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The output that relates to the problem. Remove secrets before you add it.
      render: text

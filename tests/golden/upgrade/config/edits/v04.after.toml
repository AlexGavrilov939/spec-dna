spec-dna = "0.6.0"
exclude = ["docs/vendor/**"]

# The fixture shows the requirement lint, which the default profile turns off.
[rules]
lint = "warning"

[[roots]]
path = "docs"
type = "mixed"
default-type = "requirements"
status = "active"
legacy-keys = ["R-{n}"]
live-sections = {}

[[roots]]
path = "docs/decisions"
type = "decision"
legacy-ids = ["ADR-{n}"]
live-sections = {}

[budgets.research]
soft = 300
hard = 600

[context]
budget = 2500

[change]
policy = "none"

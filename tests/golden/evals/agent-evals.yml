name: Agent evals
on:
  pull_request:
    paths:
      - CLAUDE.md
      - AGENTS.md
      - .claude/agents/**
      - .claude/skills/**
      - .claude/settings.json
      - evals/**
  push:
    branches:
      - main
    paths:
      - CLAUDE.md
      - AGENTS.md
      - .claude/agents/**
      - .claude/skills/**
      - .claude/settings.json
      - evals/**
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evals:
    # The job runs only when the repository variable SPEC_DNA_EVALS is true.
    # A pull request from a fork gets no secrets, so the job skips it.
    if: vars.SPEC_DNA_EVALS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CLAUDE_CODE_VERSION: "2.1.325"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned spec-dna
        run: |
          pin=$(sed -n 's/^spec-dna = "\(.*\)"/\1/p' spec-dna.toml)
          src=$(sed -n 's/^install-source = "\(.*\)"/\1/p' spec-dna.toml)
          asset="spec-dna-$pin-x86_64-unknown-linux-gnu"
          sum=$(sed -n "s/^\"$asset\" = \"\(.*\)\"/\1/p" spec-dna.toml)
          if [ -z "$src" ] && [ -n "$sum" ]; then
            curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$asset" "https://github.com/AlexGavrilov939/spec-dna/releases/download/v$pin/$asset"
            echo "$sum  $RUNNER_TEMP/$asset" | sha256sum --check -
            install -D -m 755 "$RUNNER_TEMP/$asset" "$HOME/.local/bin/spec-dna"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            cargo install --locked --git "${src:-https://github.com/AlexGavrilov939/spec-dna}" --tag "v$pin" spec-dna
          fi
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" # zizmor: ignore[adhoc-packages]
      - name: Run the evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: spec-dna eval run

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 392" width="936" height="392" role="img" aria-label="spec-dna: an agent writes one change (intent, spec, plan, code and tests). finish applies its delta to the current truth in docs and deletes the folder. check gates each pull request, and context gives the agent only the sections that its task needs.">
  <title>spec-dna: an agent writes one change (intent, spec, plan, code and tests). finish applies its delta to the current truth in docs and deletes the folder. check gates each pull request, and context gives the agent only the sections that its task needs.</title>

path = "src/hook.rs"
line = 1716
text = "The hook `protect-approvals` denies the commit of `finish` when the change has a record. `finish` stages the delete of the record and the new archive file, and `git diff --name-only HEAD` then sees a rename and prints only the archive path. The hook never reads the deleted record, so the archive file looks forged. docs/harness.md and docs/commands.md say that this commit passes. Pass `--no-renames` to the `git diff`. The test `allows_the_commit_of_finish_that_moves_the_record_to_the_archive` in tests/hook_approvals.rs does not stage the paths, so it does not find this."

[[finding]]
acceptor = 1
severity = "nit"
path = "src/record.rs"
line = 905
text = "`add_acceptor` puts the new entry after the first `[[acceptor]]` table that another table follows, not after the last one, as its comment says. If an `[[attempt]]` comes between 2 acceptor tables, the new entry gets position 2 and `accept` prints `acceptor: 3`, so the attempts and findings point at the wrong entries. Only a record with an entry that a person added by hand has this layout."

[[finding]]
acceptor = 1
severity = "nit"
path = "src/accept.rs"
line = 327
text = "`accept` writes a skeleton with no check of the size. A change with 401 code paths in `paths` got a skeleton of 20,927 bytes, over the limit of 16,384 bytes. The acceptor must not change `paths`, so the record can never be valid, and `finish` can only stop with SD928. Refuse with a clear message, or change the limit."


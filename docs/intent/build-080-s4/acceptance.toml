path = "src/acceptance.rs"
line = 163
text = "`plan_facts` counts each item of `Files`, and of the `Files:` of a task, that SD913 reads, also a bare name such as `Makefile`. Since dca7fe2, `scope_of` (src/accept.rs line 131) drops such a name. A plan whose paths are only bare names thus gives `scope = []` and `paths = []`, and `validate` (src/record.rs lines 374 and 393) gives SD928 for each record of the change. The acceptor may not change `scope` or `paths`, so no record of the change can be valid, and `finish` cannot pass. `accept` exits 0 and writes the skeleton, and the messages of `finish` and `next` tell the acceptor to fix the record. No message names the 2 ways out: `./Makefile` in the plan, or `[change] shared-paths`. The 2 rules are also not in the list of a valid record in docs/commands.md line 408. Use one rule in the 2 places, or let `accept` refuse and name the fix."

[[finding]]
acceptor = 1
severity = "important"
path = "src/hook.rs"
line = 1836
text = "The archive rule of the hook compares the bytes of the working tree with the bytes of a git object. With `core.autocrlf = true`, the default of Git for Windows, the record is CRLF on disk and LF in `HEAD`, and `git status` is clean. `finish` writes the archive file with the CRLF bytes. The hook then denies the commit of `finish`. `check` (src/lifecycle.rs line 2472, through `archive_differs`) gives SD935 for the archive file in each later run on that checkout. `next` (src/stage.rs line 365) compares the text of `HEAD` with the text on disk, so it keeps the item `accept` open. Windows is a release target, and ADR 0019 reads CRLF as LF for SD503 for the same cause. Compare the text of the index, or read CRLF as LF."


path = "src/lifecycle.rs"
line = 2447
text = "`check` takes as the archive file of a deleted change the added file of `.spec-dna/accepted/` with the highest `archive_number` of its slug. `archive_number` (src/acceptance.rs line 43) reads `<slug>-<n>.toml` as file n of `<slug>`, so the archive file of a change `fix-2` is also file 2 of the change `fix`. When one diff finishes `fix` and `fix-2`, `check` binds `fix-2.toml` to `fix` and gives SD935 on a valid archive file, and its fix (write the file again with `finish`) cannot work. When the diff deletes `fix` with no `finish`, `fix-2.toml` hides SD927, and with `SD935 = \"off\"` a change with no record passes. The same wrong file feeds SD929, SD930 and SD933. The field `change` of the archive file tells the 2 apart: take only a file whose `change` is the slug, or use a name rule with no overlap."

[[finding]]
acceptor = 1
severity = "nit"
path = "src/finish.rs"
line = 597
text = "When no rule needs a record (a plan of a pin before 0.8.0), `finish` moves the folder record to the archive with no check. A committed skeleton with `pending` values goes to the archive, `finish` and `finish --dry-run` exit 0, and `check` then gives 7 SD928 on a file that SD935 forbids to edit. The SD928 message says `write the answer`, but the only way out is a revert of `finish`. `check` gives SD928 on the folder record before `finish`, so the person had a warning. Refuse to move a record that is not valid, or give the message the revert."


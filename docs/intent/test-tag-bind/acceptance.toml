text = "False proof by the dotted classname rule. `Names::class` adds the part before the last `.` as a key, also when the whole classname already names a test file. pytest: the module-level case of tests/test_close.py (classname tests.test_close) fits app/tests.py by the key `tests`, so a skipped tagged test_close of app/tests.py reads as proven (a Django layout). cargo-nextest: the lib case valves::tests::closes (classname app) fits tests/app.rs, so the tag above an ignored fn closes there reads as proven, with no SD621. Not the known monorepo suffix case: the case names another file of the same tree. A fix: use the module key only when the whole classname names no test file, and do not fit a one-segment crate classname to a file stem."

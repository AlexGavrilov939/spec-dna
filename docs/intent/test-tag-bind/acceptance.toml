text = "The hook scan gives false notes for `mvn -q -DskipTests package`, `./gradlew build -x test`, `npx eslint --plugin jest` and `pytest --collect-only`, and no note for `bun test` or `tox`. docs/init.md says that a build tool counts only with a goal that runs the tests, but -DskipTests and -x test turn the tests off. The rule also differs from D89 item 3 of docs/design/0.8.1-a-lifecycle-and-harness.md (words of id or entry), and the design page is not amended."

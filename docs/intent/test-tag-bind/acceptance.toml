line = 1024
text = "False proof by a display name, and a regression from 0.8.0. For the forms def and method, the head of a case name ends at the first space, so a display name of another test that starts with the method name names the method. xUnit: the tag above [Fact(Skip)] Closes() reads as proven by the passed `Closes when cold` of Cold(). The same for JUnit 5 @DisplayName with display names in the report. 0.8.0 gave SD616 skipped. The data-set form of PHPUnit (`testOne with data set #0`) needs the space; a narrower rule (for example ` with data set `, or a space only after `(...)`) keeps it."
[[finding]]

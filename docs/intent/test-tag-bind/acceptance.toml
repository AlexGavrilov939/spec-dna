text = "A template counts as a twin only in the same chain (`theirs(*line).is_none_or(|c| &c == mine)`). A template in a nested group whose join gives the full title of the tag, in the space join of jest-junit with the file or RSpec, does not make the identity not unique, so the bind stays silent. docs/test-report.md line 242 (limit 6) says that a template that can give the title of a plain test makes that test weak. A plain nested test is caught. The result is correct for each report that also holds the case of the tagged test, because the 2 cases then share a key and the worst decides. Only a report without the tagged case gives a silent pass, so this is a missing SD621 and no false proof of a real run."


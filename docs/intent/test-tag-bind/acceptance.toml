path = "src/evidence.rs"
line = 972
text = "False proof by a template test. `tests_of` keeps only `Under::Test`, so `belongs_elsewhere` never sees a test with a template name (it.each, test.each, a literal with `${}`) or a test of another file that runs in this one (an RSpec shared example). The form call binds each case whose name ends with ` <literal>`, so `Valves > fast opens` of it.each(['fast'])('%s opens') proves the tag above it.skip('opens') in the same file, with fit classname or file and no SD621. The core promise breaks: a case of another test proves the requirement. A fix: count the templates of the file as tests that can own a case, or make a template name a shared set."

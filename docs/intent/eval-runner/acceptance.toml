line = 979
text = "A SIGINT or SIGTERM of the runner while the agent runs gives charged 0 for that run, in --ab and --arms also, so spend_usd of the partial file does not hold the money of that agent. 0.8.0 does the same, and the docs say that only a run that ended before the signal is in the spend."

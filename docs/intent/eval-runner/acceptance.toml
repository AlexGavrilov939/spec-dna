[[finding]]
acceptor = 1
severity = "blocker"
path = "src/eval_run.rs"
line = 1081
text = "Money is under-counted. A run that is not whole (a time limit, a signal, a cut stream) counts max-budget-usd, also when the last total_cost_usd of its stream is higher. Claude Code checks the budget against an estimate, and with segments the total of the session can pass the budget, so a known spend is dropped. Repro: a stub prints a result event with total_cost_usd 1.5 for a budget of 1 and is then killed: spend 1. On the same stubs, --ab gives 14.5 USD where 0.8.0 gives 15. The same rule is at line 1045 (a signal in a check), and eval_ab.rs:849 and :854 add this charge. No test covers a reported cost above the budget. Fix: count the larger of the budget and the reported cost."

[[finding]]
acceptor = 1
severity = "blocker"
path = "src/eval_run.rs"
line = 1075
text = "A changed behaviour of --ab that the spec does not name. A limit in any segment now fails the run and is its subtype (also line 1609), and a cut stream fails the run. With one result event error_max_turns and exit code 0, the side passed in 0.8.0 and fails now, so the passes and the verdict change. The spec lists the changes and points to D95 and D100 as the contract. D95 item 5 takes the subtype from the last result event, as in 0.8.0. Commit 31501c6 says that the code differs from D95 item 5. Only CHANGELOG.md and docs/evals.md name the rule. Fix: get the owner to amend the spec and D95, or keep the rule of 0.8.0."

[[finding]]
acceptor = 1
severity = "note"
path = "src/eval_run.rs"
line = 1816
text = "An agent that ran (assistant events, no result event) and that a signal or a lost connection ends is a refusal: the reader drops each event, so the stdout is empty and the stderr gives the class. --ab and --arms then count 0 USD (eval_ab.rs:872), and the retry runs again. The stream shows that the agent spent money, and the reader sets cut for it. 0.8.0 does the same, and docs/evals.md states the rule for a refused attempt, so this is no blocker. The owner can decide if a cut stream is a run."

[[finding]]
acceptor = 1

text = "A signal to the runner while the agent runs gives charged 0 and drops the stream: a result event that reported 1.5 USD before the SIGINT is not in spend_usd (repro: spend 0.1 in place of 1.6), and --resume keeps the lower spend for the cap. 0.8.0 does the same, and docs/evals.md (Stop and resume) states that only a run that ended before the signal is in the spend, so this is no blocker. The Concern of the spec says a run that the runner stops by a time limit or a signal counts the larger of the budget and the reported cost. That text can be read to cover this case. The owner can confirm the scope, or a later change can count the reported cost of the stream here."


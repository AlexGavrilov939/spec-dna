text = "fix-limit can print its message 2 times for one key when calls run at the same time, so the unit test hook::tests::fix_limit_speaks_once_for_calls_at_the_same_time (src/hook.rs:2879) is not stable, and cargo test of Proof fails. It failed in 1 of 2 full runs (round 15: left 2, right 1) and in 1 of 15 runs of the test alone (round 23), on a machine with a load average of about 90. In the test, no pass runs, so the only removal of the .said file is the one of d12: a failure that saw no count file removes .said. A cause that fits: call A sees no count file at the first failures and stops before the removal. Other calls make the count, reach the limit and create .said. A then removes .said. A lost update (a slow call writes an old count) brings the count back to the limit, and a second call creates .said and speaks. docs/commands.md and docs/harness.md say that the hook prints the message once for each key, also for calls that run at the same time."

